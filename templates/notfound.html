
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calorie Vision · Not Found</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--bg:#0b1020;--text:#f8f9fa;--muted:#cfd3d7;--glass:rgba(255,255,255,.12);--brd:rgba(255,255,255,.22);--shadow:0 24px 70px rgba(0,0,0,.45);}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;}
    .bg-wrap{position:fixed;inset:0;z-index:-1}
    .bg-wrap video{position:absolute;width:100%;height:100%;object-fit:cover;filter:brightness(.46) saturate(1.1)}
    .glass{backdrop-filter: blur(18px) saturate(120%);background:var(--glass);border:1px solid var(--brd);border-radius:26px;box-shadow:var(--shadow)}
    .wrap{max-width:860px;margin:4rem auto;padding:2rem}
    .chips{display:flex;flex-wrap:wrap;gap:.6rem}
    .chip{padding:.6rem .95rem;border-radius:999px;border:1px dashed rgba(255,255,255,.25)}
  </style>
</head>
<body>
  <div class="bg-wrap">
    <video autoplay muted loop playsinline>
      <source src="https://cdn.pixabay.com/video/2020/12/15/60660-494003099_large.mp4" type="video/mp4" />
    </video>
  </div>

  <main class="wrap glass text-center">
    <h1 class="mb-3">We couldn't find that item</h1>
    <p class="text-secondary">Your search: <strong>{{ query }}</strong></p>
    <p class="text-secondary">Try one of the common foods below or go back to start.</p>

    <div class="chips my-3">
      {% for s in suggestions %}
      <a class="chip text-decoration-none text-light" href="javascript:go('{{ s }}')">{{ s }}</a>
      {% endfor %}
    </div>

    <div class="mt-4 d-flex justify-content-center gap-2">
      <a href="/" class="btn btn-outline-light rounded-4 px-4">Back</a>
    </div>
  </main>

  <script>
    function go(x){
      const f = document.createElement('form');
      f.method='POST'; f.action='/analyze';
      const i = document.createElement('input'); i.name='food'; i.value=x; f.appendChild(i);
      document.body.appendChild(f); f.submit();
    }
  </script>
</body>
</html>
