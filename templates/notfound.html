{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block content %}
<section class="glass panel text-center" style="max-width: 760px; margin: 0 auto;">
  <i class="bi bi-search fs-1"></i>
  <h1 class="mt-2 mb-3">We couldn't find that</h1>
  <p class="muted">You searched for <strong>{{ query }}</strong>.</p>
  <p class="muted">Pick one of these, or go back and try different words.</p>

  <div class="my-3">
    {% for s in suggestions %}
    <form class="d-inline" method="post" action="{{ url_for('web.analyze') }}">
      <input type="hidden" name="food" value="{{ s }}">
      <button class="chip" type="submit">{{ s }}</button>
    </form>
    {% endfor %}
  </div>

  <a href="{{ url_for('web.index') }}" class="ghost mt-2"><i class="bi bi-arrow-left"></i> Back</a>
</section>
{% endblock %}
