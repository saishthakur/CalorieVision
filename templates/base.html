<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calorie Vision · {% block title %}Home{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/app.css') }}" rel="stylesheet">
</head>
<body>
  <div class="container" style="max-width: 1040px;">
    <nav class="topnav">
      <a class="brand" href="{{ url_for('web.index') }}"><i class="bi bi-eye"></i> Calorie <span>Vision</span></a>
      <div class="navlinks">
        <a href="{{ url_for('web.index') }}" class="{{ 'active' if request.endpoint == 'web.index' }}">Analyze</a>
        <a href="{{ url_for('web.history_page') }}" class="{{ 'active' if request.endpoint == 'web.history_page' }}">History</a>
      </div>
    </nav>

    <main class="fade-up">
      {% block content %}{% endblock %}
    </main>

    <p class="footer text-center my-4">Calorie values are approximate per standard serving. Not medical advice.</p>
  </div>

  <script>
    // Daily goal shared by every page (per browser).
    window.CV = {
      goal() {
        try { return parseInt(localStorage.getItem('cv-goal'), 10) || 2000; } catch { return 2000; }
      },
      setGoal(v) { try { localStorage.setItem('cv-goal', String(v)); } catch {} },
    };
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
